<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SG APP LAURA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #ffffff;
        background-image: 
          radial-gradient(circle at 50% 0%, #3f0000 0%, transparent 60%),
          linear-gradient(to bottom, #000000, #0a0a0a);
        min-height: 100vh;
      }
      .font-tech {
        font-family: 'Orbitron', sans-serif;
      }
      .glass-panel {
        background: rgba(10, 10, 10, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 30, 30, 0.15);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }
      .neon-border-red {
        box-shadow: 0 0 10px rgba(220, 38, 38, 0.3), inset 0 0 5px rgba(220, 38, 38, 0.1);
        border: 1px solid rgba(220, 38, 38, 0.5);
      }
      .neon-text {
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
      }
      .neon-text-red {
        text-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .scanline::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(255, 0, 0, 0.1), transparent);
        animation: scanline 4s linear infinite;
        pointer-events: none;
      }
    </style>
